spring:
  config:
    activate:
      on-profile: sqlite
  datasource:
    url: jdbc:sqlite:educatalog_progress.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
