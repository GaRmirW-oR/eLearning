server:
  port: 8081

spring:
  application:
    name: auth-service
  profiles:
    active: sqlite
  jpa:
    show-sql: true
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: INFO
    org.springframework.security: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    prefer-ip-address: true

app:
  security:
    admin:
      username: admin
      password: password
